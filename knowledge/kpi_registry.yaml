  "adopted_assumptions": {
    "grain": "One defect_id is a logged event, not a distinct defective unit. No unit/serial denominator; never call intensity defect probability or yield.",
    "scope": "Inclusive January-June 2024 full months. Valid 2026 dates remain unchanged and outside primary scope.",
    "dates": "ISO supported. Slash convention M/D/YYYY inferred from unambiguous source majority; unambiguous D/M exceptions parsed explicitly. Both components <=12 and unequal are convention-dependent and flagged; confirm source owner.",
    "deduplication": "Remove identical payload copies; canonical case/whitespace equivalent same-ID copies collapse. Same noncost fields with one distinct known cost plus null can retain observed cost. Any contradictory same-ID variants all quarantined, including invalid mandatory-field variant.",
    "master_join": "Validate master unique product_id, collapse exact equivalent master copies, reject conflicting master IDs. Left join events; unmatched remain in plant totals Unknown, excluded linked intensity.",
    "cost": "Valid finite nonnegative observed numeric costs, zero included; missing/negative/invalid remain unknown and retained for counts. No imputation. Currency is unspecified local currency. Observed cost 10 remains valid in canonical; financial withholding is a separately labeled scenario.",
    "exposure": "monthly_output is static reference exposure repeated each full month. Include every eligible master product, including zero-event products. Product/line/category restrict master cohort; event attributes restrict numerator only. Missing output makes intensity unavailable.",
    "calendar": "No logged events on a date does not prove no defects, zero production or complete reporting.",
    "association": "Exploratory chi-square excludes Unknown cells; require minimum expected >=1 and <=20 percent expected cells below5. Cramers V describes association size, not causality.",
    "anomaly": "Freeze January mean over31 calendar days. Flag February-June counts strictly greater than mean+3sqrt(mean). No validated SPC/detector accuracy without exposure/reporting and truth labels.",
    "causality": "Static line/category mapping confounds line and product mix. Changes in observed counts cannot establish process improvement or deterioration causally."
  },
  "kpis": {
    "event_count": {
      "formula": "count(retained nonconflicting unique in-scope defect events)",
      "unit": "logged events",
      "population": "Selected retained defect events after canonical cleaning and declared scenario, unless the formula specifies master products",
      "period": "Selected inclusive full months",
      "rounding": "Backend retains full precision for ratios; observed cost totals use two decimal places. UI locale rounding does not change evidence values.",
      "exclusions": "Quarantined rows and out-of-period events excluded from selected events; invalid/missing/scenario-withheld cost excluded only from financial metrics; orphan events excluded only from reference-output numerator."
    },
    "critical_share_pct": {
      "formula": "count(severity=Critical)/event_count*100",
      "zero_denominator": null,
      "population": "Selected retained defect events after canonical cleaning and declared scenario, unless the formula specifies master products",
      "period": "Selected inclusive full months",
      "rounding": "Backend retains full precision for ratios; observed cost totals use two decimal places. UI locale rounding does not change evidence values.",
      "exclusions": "Quarantined rows and out-of-period events excluded from selected events; invalid/missing/scenario-withheld cost excluded only from financial metrics; orphan events excluded only from reference-output numerator."
    },
    "known_repair_cost": {
      "formula": "sum(valid observed nonnegative repair_cost)",
      "unit": "unspecified local currency",
      "coverage_required": true,
      "population": "Selected retained defect events after canonical cleaning and declared scenario, unless the formula specifies master products",
      "period": "Selected inclusive full months",
      "rounding": "Backend retains full precision for ratios; observed cost totals use two decimal places. UI locale rounding does not change evidence values.",
      "exclusions": "Quarantined rows and out-of-period events excluded from selected events; invalid/missing/scenario-withheld cost excluded only from financial metrics; orphan events excluded only from reference-output numerator."
    },
    "cost_coverage_pct": {
      "formula": "known_cost_count/event_count*100",
      "zero_denominator": null,
      "population": "Selected retained defect events after canonical cleaning and declared scenario, unless the formula specifies master products",
      "period": "Selected inclusive full months",
      "rounding": "Backend retains full precision for ratios; observed cost totals use two decimal places. UI locale rounding does not change evidence values.",
      "exclusions": "Quarantined rows and out-of-period events excluded from selected events; invalid/missing/scenario-withheld cost excluded only from financial metrics; orphan events excluded only from reference-output numerator."
    },
    "reference_output": {
      "formula": "sum(monthly_output of all eligible master products)*full_month_count",
      "unit": "reference units",
      "population": "Selected retained defect events after canonical cleaning and declared scenario, unless the formula specifies master products",
      "period": "Selected inclusive full months",
      "rounding": "Backend retains full precision for ratios; observed cost totals use two decimal places. UI locale rounding does not change evidence values.",
      "exclusions": "Quarantined rows and out-of-period events excluded from selected events; invalid/missing/scenario-withheld cost excluded only from financial metrics; orphan events excluded only from reference-output numerator."
    },
    "reference_intensity_per_1000": {
      "formula": "linked_event_count/reference_output*1000",
      "unit": "logged events per1000 reference units",
      "is_defect_probability": false,
      "population": "Selected retained defect events after canonical cleaning and declared scenario, unless the formula specifies master products",
      "period": "Selected inclusive full months",
      "rounding": "Backend retains full precision for ratios; observed cost totals use two decimal places. UI locale rounding does not change evidence values.",
      "exclusions": "Quarantined rows and out-of-period events excluded from selected events; invalid/missing/scenario-withheld cost excluded only from financial metrics; orphan events excluded only from reference-output numerator.",
      "denominator": "Every eligible master product monthly_output multiplied by the number of selected full months, including zero-event products. Event attributes never shrink this cohort. Any missing output makes the complete intensity unavailable."
    },
    "january_june_change_pct": {
      "formula": "(June_event_count-January_event_count)/January_event_count*100",
      "zero_denominator": null,
